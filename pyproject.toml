[project]
name = "discord-lyr"
version = "0.2.8"
description = "Discord CLI for local-first sync, search, export, and agent-friendly retrieval"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "jackwener" }]
keywords = ["discord", "cli", "sqlite", "agent", "discord-cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
urls = { Homepage = "https://github.com/jackwener/discord-cli", Repository = "https://github.com/jackwener/discord-cli", Issues = "https://github.com/jackwener/discord-cli/issues" }
dependencies = [
    "httpx>=0.27",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.11",
    "twine>=6.0", "pkginfo>=1.11"]


[project.scripts]
discord = "discord_cli.cli.main:cli"

[build-system]
# hatchling>=1.26 writes Metadata-Version 2.5 (PEP 639) which twine check
# cannot parse on all Python versions — pin below 1.26 for 2.4 metadata.
# hatchling>=1.26 writes Metadata-Version 2.5 (invalid); 1.26.0 writes 2.3
# (too old for PEP 639 license-expression). 1.27-1.28 write valid 2.4.
requires = ["hatchling>=1.27,<1.29"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/discord_cli",
    "tests",
    "README.md",
    "README_CN.md",
    "SKILL.md",
    ".env.example",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100
