<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-labelledby="sec3-title sec3-desc">
  <title id="sec3-title">Session Hook</title>
  <desc id="sec3-desc">Section banner showing ambient Discord context injected at agent startup</desc>

  <defs>
    <linearGradient id="sec3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="#1e1e1e"/>

  <text x="80" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" fill="#d4d4d4">
    <tspan fill="url(#sec3Grad)">Session</tspan> Hook
  </text>

  <text x="80" y="95" font-family="JetBrains Mono, Fira Code, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#858585">
    Ambient Discord context injected at every agent session start
  </text>

  <g transform="translate(720, 15)">
    <rect width="400" height="110" rx="6" fill="#1a1a1a" stroke="#2d2d2d"/>
    <rect width="400" height="30" rx="6" fill="#252526"/>
    <circle cx="14" cy="15" r="5" fill="#ff5f57"/>
    <circle cx="30" cy="15" r="5" fill="#ffbd2e"/>
    <circle cx="46" cy="15" r="5" fill="#28ca42"/>
    <text x="200" y="20" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#858585">$ discord hook --force</text>

    <g transform="translate(12, 48)">
      <text x="0" y="0" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#b8b8b8" line-height="1.6">
        <tspan fill="#34d399">bin:</tspan> <tspan fill="#9cdcfe">"~/.local/bin/discord"</tspan>
        <tspan x="0" dy="1.4em" fill="#34d399">status:</tspan>
        <tspan x="0" dy="1.4em">  </tspan><tspan fill="#4ec9b0">authenticated: </tspan><tspan fill="#7ee787">true</tspan>
        <tspan x="0" dy="1.4em">  </tspan><tspan fill="#4ec9b0">guilds: </tspan><tspan fill="#b5cea8">5</tspan>
        <tspan x="0" dy="1.4em">  </tspan><tspan fill="#4ec9b0">channels_tracked: </tspan><tspan fill="#b5cea8">42</tspan>
        <tspan x="0" dy="1.4em">  </tspan><tspan fill="#4ec9b0">messages_stored: </tspan><tspan fill="#b5cea8">45230</tspan>
      </text>
    </g>
  </g>
</svg>