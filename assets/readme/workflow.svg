<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">discord-cli Workflow: Sync → Query → Export</title>
  <desc id="workflow-desc">Three-stage pipeline: Discord API → Local SQLite → Structured Output (YAML/JSON/TOON)</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="320">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#4752c4"/>
    </linearGradient>
    <linearGradient id="localGrad" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#1a7f2a"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="0" y2="120">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="120" y2="0">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#arrowGrad)"/>
    </marker>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- Stage 1: Discord API -->
  <g transform="translate(60, 70)">
    <rect width="300" height="180" rx="12" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
    <rect x="0" y="0" width="300" height="48" rx="12" fill="url(#discGrad)"/>
    <text x="150" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Discord API</text>

    <g transform="translate(20, 65)">
      <text x="0" y="0" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" font-weight="500" fill="#58a6ff">guilds[5]</text>
      <text x="0" y="24" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">channels[42]</text>
      <text x="0" y="48" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">messages[~50k]</text>

      <g transform="translate(0, 90)">
        <rect width="260" height="60" rx="6" fill="#0d1117" stroke="#21262d"/>
        <text x="130" y="20" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#8b949e">HTTP API v10</text>
        <text x="130" y="40" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#8b949e">Rate limited</text>
        <text x="130" y="56" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#8b949e">Retry + jitter</text>
      </g>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 360 160 L 460 160" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
fetch &amp; sync

  <!-- Stage 2: Local SQLite -->
  <g transform="translate(480, 70)">
    <rect width="240" height="180" rx="12" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
    <rect x="0" y="0" width="240" height="48" rx="12" fill="url(#localGrad)"/>
    <text x="120" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Local SQLite</text>

    <g transform="translate(15, 65)">
      <text x="0" y="0" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" font-weight="500" fill="#7ee787">messages</text>
      <text x="0" y="24" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">id, channel_id, sender_id</text>
      <text x="0" y="44" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">sender_name, content</text>
      <text x="0" y="64" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">timestamp, guild_name</text>

      <g transform="translate(0, 90)">
        <rect width="210" height="60" rx="6" fill="#0d1117" stroke="#21262d"/>
        <text x="105" y="20" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#7ee787">Indexed</text>
        <text x="105" y="38" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#8b949e">by channel_id</text>
        <text x="105" y="56" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#8b949e">by timestamp</text>
      </g>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 720 160 L 820 160" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
query &amp; export

  <!-- Stage 3: Structured Output -->
  <g transform="translate(840, 70)">
    <rect width="300" height="180" rx="12" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
    <rect x="0" y="0" width="300" height="48" rx="12" fill="url(#outGrad)"/>
    <text x="150" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Structured Output</text>

    <g transform="translate(20, 65)">
      <text x="0" y="0" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" font-weight="500" fill="#d2a8ff">TOON</text>
      <text x="0" y="24" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">~40% smaller than JSON</text>
      <text x="0" y="48" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">Token-efficient</text>

      <text x="0" y="84" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" font-weight="500" fill="#7ee787">YAML</text>
      <text x="0" y="108" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">Human-readable</text>
      <text x="0" y="128" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">Agent default</text>

      <text x="0" y="164" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" font-weight="500" fill="#58a6ff">JSON</text>
      <text x="0" y="188" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">Strict typing</text>
      <text x="0" y="208" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#8b949e">Machine parsing</text>
    </g>

    <!-- Envelope schema hint -->
    <g transform="translate(20, 245)">
      <rect width="260" height="55" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="130" y="18" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#4ec9b0">Envelope Schema</text>
      <text x="130" y="38" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#8b949e">ok: true | schema_version: "1" | data: [...]</text>
    </g>
  </g>
</svg>