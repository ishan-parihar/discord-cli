<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-labelledby="sec1-title sec1-desc">
  <title id="sec1-title">Installation & Quick Start</title>
  <desc id="sec1-desc">Section banner for installation and quick start commands</desc>

  <defs>
    <linearGradient id="sec1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ec9b0"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="#1e1e1e"/>

  <text x="80" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" fill="#d4d4d4">
    <tspan fill="url(#sec1Grad)">Install</tspan> & <tspan fill="url(#sec1Grad)">Quick Start</tspan>
  </text>

  <text x="80" y="95" font-family="JetBrains Mono, Fira Code, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#858585">
    Four commands from zero to structured output
  </text>

  <g transform="translate(720, 15)">
    <rect width="400" height="110" rx="6" fill="#1a1a1a" stroke="#2d2d2d"/>
    <rect width="400" height="30" rx="6" fill="#252526"/>
    <circle cx="14" cy="15" r="5" fill="#ff5f57"/>
    <circle cx="30" cy="15" r="5" fill="#ffbd2e"/>
    <circle cx="46" cy="15" r="5" fill="#28ca42"/>
    <text x="200" y="20" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#858585">$ discord auth --save</text>

    <g transform="translate(12, 48)">
      <text x="0" y="0" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#b8b8b8">
        <tspan fill="#4ec9b0">discord $</tspan> <tspan fill="#dcdcaa">auth</tspan> <tspan fill="#9cdcfe">--save</tspan>
        <tspan x="0" dy="1.6em" fill="#4ec9b0">discord $</tspan> <tspan fill="#dcdcaa">status</tspan>
        <tspan x="0" dy="1.6em" fill="#4ec9b0">discord $</tspan> <tspan fill="#dcdcaa">dc</tspan> <tspan fill="#9cdcfe">sync-all</tspan>
        <tspan x="0" dy="1.6em" fill="#4ec9b0">discord $</tspan> <tspan fill="#dcdcaa">today</tspan> <tspan fill="#9cdcfe">--yaml</tspan>
      </text>
    </g>
  </g>
</svg>